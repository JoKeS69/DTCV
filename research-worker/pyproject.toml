[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detective-research-worker"
version = "0.1.7"
description = "DETECTIVE research worker: SQLite upserts, pending supersede, subject-vs-victim roles, publish dedupe."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.60.0",
  "pydantic>=2.10.0",
  "httpx>=0.28.0",
  "python-dotenv>=1.0.0",
  "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
research-worker = "research_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["research_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
